[workspace]
resolver = "2"
members = [
    "crates/aegis-common",
    "crates/aegis-worker",
    "crates/aegis-collectors",
    "crates/aegis-ioc",
    "crates/aegis-osint",
    "crates/aegis-scanner",
    "crates/aegis-container",
    "crates/aegis-malware",
    "crates/aegis-analyzer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "macros"] }
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls", "socks"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1.3"
futures = "0.3"
flate2 = "1.0"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = "0.16"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
axum = "0.7"
tower-http = { version = "0.5", features = ["limit", "trace"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
