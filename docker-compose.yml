# ─────────────────────────────────────────────────────────────────────────────
# Aegis CTI — full local stack
# Usage: cp .env.example .env && docker compose up -d  (pulls prebuilt images;
# add --build to compile from source locally)
# ─────────────────────────────────────────────────────────────────────────────
name: aegis-cti

x-common-env: &common-env
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}

networks:
  aegis:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  osdata:

services:
  # ── PostgreSQL — system of record ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── Redis — cache / queues / pub-sub ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    # data cap under the 256m mem_limit — evict, don't OOM-kill
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me_redis}
      --appendonly yes
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── OpenSearch — full-text / IOC search ────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-change_me_opensearch}"
      # Security plugin OFF here for local dev ONLY. The k8s and Helm deploy
      # paths run it enabled (auth + TLS on 9200). Do not copy this dev posture
      # to a production deployment.
      - plugins.security.disabled=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks: [aegis]

  # ── Node.js API — REST + GraphQL + WS ──────────────────────────────────────
  api:
    image: ghcr.io/elder234/aegis-cti-api:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: [.env]
    environment:
      <<: *common-env
      ANALYZER_URL: ${ANALYZER_URL:-http://analyzer:7000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      analyzer: { condition: service_started }
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── Rust worker — background jobs, feed parsing, IOC processing ─────────────
  worker:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-worker"]
    restart: unless-stopped
    mem_limit: 256m
    env_file: [.env]
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aegis]

  # ── Rust collectors — OSINT + threat feeds ─────────────────────────────────
  collectors:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-collectors"]
    restart: unless-stopped
    mem_limit: 256m
    env_file: [.env]
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aegis]

  # ── Rust scanner — network/TLS/HTTP scanning worker ─────────────────────────
  scanner:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-scanner"]
    restart: unless-stopped
    mem_limit: 384m
    env_file: [.env]
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aegis]

  # ── Web console — React SPA + Nginx reverse proxy ───────────────────────────
  web:
    image: ghcr.io/elder234/aegis-cti-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      api: { condition: service_started }
    ports:
      # Container nginx listens on 8080 only (unprivileged). TLS is terminated
      # by the host reverse proxy / Certbot on the VPS, not inside this image.
      - "8080:8080"
    networks: [aegis]

  # ── Aegis analyzer sidecar — Module 9 malware static analysis ─────────────
  analyzer:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-analyzer"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
      ANALYZER_PORT: "7000"
      ANALYZER_MAX_BYTES: "33554432"
    expose:
      - "7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── Tor proxy (optional; enable with `--profile tor`) ──────────────────────
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["tor"]
    networks: [aegis]
