# ─────────────────────────────────────────────────────────────────────────────
# Aegis CTI — full local stack
# Usage: cp .env.example .env && docker compose up -d  (pulls prebuilt images;
# add --build to compile from source locally)
# ZERO host ports are published. The dashboard is reached ONLY through the
# Cloudflare Tunnel (cloudflared service) at https://yourdomain.com — the VPS
# makes outbound connections only. One-time setup (see README):
#   docker run --rm -it -v "$PWD/deploy/cloudflared:/root/.cloudflared" cloudflare/cloudflared tunnel login
#   docker run --rm -it -v "$PWD/deploy/cloudflared:/root/.cloudflared" cloudflare/cloudflared tunnel create aegis
#   cp deploy/cloudflared/config.yml.example deploy/cloudflared/config.yml   # fill UUID + domain
#   docker run --rm -it -v "$PWD/deploy/cloudflared:/root/.cloudflared" cloudflare/cloudflared tunnel route dns <uuid> yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────
name: aegis-cti

x-common-env: &common-env
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}

networks:
  aegis:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  osdata:

services:
  # ── PostgreSQL — system of record ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── Redis — cache / queues / pub-sub ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    # data cap under the 256m mem_limit — evict, don't OOM-kill
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me_redis}
      --appendonly yes
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── OpenSearch — full-text / IOC search (OPT-IN) ────────────────────────────
  # Nothing in the codebase talks to OpenSearch yet (the OPENSEARCH_* env vars
  # are reserved but unconsumed), and 2.13 needs ~1g RSS to boot with its
  # bundled plugin set. On a 1.9 GiB VPS that made it a crash-looping dead
  # weight that also blocked the API (which used to depend on its health). It
  # is profiled OUT of the default stack; enable on a box with RAM to spare:
  #   docker compose --profile opensearch up -d
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    mem_limit: 1g
    profiles: ["opensearch"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Security plugin OFF here for local dev ONLY. The k8s and Helm deploy
      # paths run it enabled (auth + TLS on 9200). Do not copy this dev posture
      # to a production deployment.
      # DISABLE_SECURITY_PLUGIN is the docker-entrypoint's documented switch for
      # the docker image: it disables the plugin from the start AND skips
      # install_demo_configuration.sh (a second JVM, securityadmin.sh, that
      # spikes memory at boot). The PA agent is unused too.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks: [aegis]

  # ── Node.js API — REST + GraphQL + WS ──────────────────────────────────────
  api:
    image: ghcr.io/elder234/aegis-cti-api:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: [.env]
    environment:
      <<: *common-env
      ANALYZER_URL: ${ANALYZER_URL:-http://analyzer:7000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      analyzer: { condition: service_started }
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── Rust worker — background jobs, feed parsing, IOC processing ─────────────
  worker:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-worker"]
    restart: unless-stopped
    mem_limit: 256m
    env_file: [.env]
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aegis]

  # ── Rust collectors — OSINT + threat feeds ─────────────────────────────────
  collectors:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-collectors"]
    restart: unless-stopped
    mem_limit: 256m
    env_file: [.env]
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aegis]

  # ── Rust scanner — network/TLS/HTTP scanning worker ─────────────────────────
  scanner:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-scanner"]
    restart: unless-stopped
    mem_limit: 384m
    env_file: [.env]
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aegis]

  # ── Web console — React SPA + Nginx reverse proxy ───────────────────────────
  web:
    image: ghcr.io/elder234/aegis-cti-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      api: { condition: service_started }
    # Container nginx listens on 8080 only (unprivileged). This service is
    # deliberately NOT published to the host — the cloudflared tunnel below is
    # the only public entrypoint.
    expose:
      - "8080"
    networks: [aegis]

  # ── Cloudflare Tunnel — sole public entrypoint (ZERO published ports) ───────
  # cloudflared dials OUT to the Cloudflare edge; yourdomain.com is served by
  # Cloudflare on 443 with a browser-trusted cert. The VPS has no open inbound
  # ports at all (egress-only). One-time setup from the repo root:
  #   docker run --rm -it -v "$PWD/deploy/cloudflared:/root/.cloudflared" cloudflare/cloudflared tunnel login
  #   docker run --rm -it -v "$PWD/deploy/cloudflared:/root/.cloudflared" cloudflare/cloudflared tunnel create aegis
  #   cp deploy/cloudflared/config.yml.example deploy/cloudflared/config.yml  # fill UUID + domain
  #   docker run --rm -it -v "$PWD/deploy/cloudflared:/root/.cloudflared" cloudflare/cloudflared tunnel route dns <uuid> yourdomain.com
  # Put the public hostname behind a Cloudflare Access application so the
  # dashboard is not open to anyone who reaches the domain (the app's own JWT
  # login is the second layer).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 64m
    command: tunnel --no-autoupdate run --config /etc/cloudflared/config.yml
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    depends_on:
      web: { condition: service_started }
    networks: [aegis]

  # ── Aegis analyzer sidecar — Module 9 malware static analysis ─────────────
  analyzer:
    image: ghcr.io/elder234/aegis-cti-rust:latest
    build:
      context: ./services/rust-core
      dockerfile: Dockerfile
    command: ["/usr/local/bin/aegis-analyzer"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *common-env
      RUST_LOG: ${RUST_LOG:-info}
      ANALYZER_PORT: "7000"
      ANALYZER_MAX_BYTES: "33554432"
    expose:
      - "7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aegis]

  # ── Tor proxy (optional; enable with `--profile tor`) ──────────────────────
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["tor"]
    networks: [aegis]
