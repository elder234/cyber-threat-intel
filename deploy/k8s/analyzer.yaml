apiVersion: v1
kind: Service
metadata:
  name: analyzer
  namespace: aegis
  labels:
    app.kubernetes.io/name: analyzer
    app.kubernetes.io/part-of: aegis-cti
spec:
  selector:
    app.kubernetes.io/name: analyzer
  ports:
    - port: 7000
      targetPort: 7000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  namespace: aegis
  labels:
    app.kubernetes.io/name: analyzer
    app.kubernetes.io/part-of: aegis-cti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analyzer
        app.kubernetes.io/part-of: aegis-cti
    spec:
      containers:
        - name: analyzer
          image: aegis-cti/analyzer:latest
          ports:
            - containerPort: 7000
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
