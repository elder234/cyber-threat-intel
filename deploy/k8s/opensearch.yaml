apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: aegis
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: aegis-cti
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: aegis
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: aegis-cti
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: aegis-cti
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.13.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: bootstrap.memory_lock
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            # Security plugin is ENABLED (default): TLS on 9200 + auth required.
            # The admin password is bootstrapped from OPENSEARCH_INITIAL_ADMIN_PASSWORD
            # on first start, so probes authenticate as admin with that value.
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: OPENSEARCH_PASSWORD
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -kfs -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -kfs -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: osdata
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: osdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
