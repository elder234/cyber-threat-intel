apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: aegis
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: aegis-cti
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aegis
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: aegis-cti
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: aegis-cti
    spec:
      containers:
        - name: web
          image: aegis-cti/web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
