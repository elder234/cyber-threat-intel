apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner
  namespace: aegis
  labels:
    app.kubernetes.io/name: scanner
    app.kubernetes.io/part-of: aegis-cti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner
        app.kubernetes.io/part-of: aegis-cti
    spec:
      containers:
        - name: scanner
          image: aegis-cti/scanner:latest
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-secrets
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
