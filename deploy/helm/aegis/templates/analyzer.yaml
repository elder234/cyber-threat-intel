apiVersion: v1
kind: Service
metadata:
  name: analyzer
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" "analyzer") | nindent 4 }}
spec:
  selector:
    {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" "analyzer") | nindent 4 }}
  ports:
    - port: {{ .Values.analyzer.port }}
      targetPort: {{ .Values.analyzer.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" "analyzer") | nindent 4 }}
spec:
  replicas: {{ .Values.analyzer.replicas }}
  selector:
    matchLabels:
      {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" "analyzer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.componentLabels" (dict "ctx" . "component" "analyzer") | nindent 8 }}
    spec:
      containers:
        - name: analyzer
          image: {{ include "aegis.image" (dict "img" .Values.analyzer.image "globals" .Values.global) }}
          imagePullPolicy: {{ .Values.analyzer.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.analyzer.port }}
          envFrom:
            - configMapRef:
                name: {{ include "aegis.fullname" . }}-config
            - secretRef:
                name: {{ include "aegis.fullname" . }}-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.analyzer.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.analyzer.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.analyzer.resources | nindent 12 }}
