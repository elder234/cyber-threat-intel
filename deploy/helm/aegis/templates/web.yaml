apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  selector:
    {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ include "aegis.namespace" . }}
  labels:
    {{- include "aegis.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "aegis.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ include "aegis.image" (dict "img" .Values.web.image "globals" .Values.global) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
