# Aegis CTI web — nginx serving the built SPA and proxying the API + WS.
# This container fronts the static assets; the top-level reverse proxy
# (deploy/nginx) may sit in front of it in production. Kept self-sufficient so
# the web image also works standalone in docker-compose.

# The API trusts X-Forwarded-For (trustProxy: true) and rate-limits anonymous
# requests by IP. Never forward the client-supplied header — take the real
# client IP from Cloudflare's cf-connecting-ip when present (tunnel edge),
# else nginx's direct peer. This closes the XFF-spoofing rate-limit bypass.
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PCAP uploads allow 256 MiB files; leave room for multipart framing.
    client_max_body_size 260M;

    # Security headers (defense in depth; the edge proxy may set stricter CSP).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache hashed assets, never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # REST API → backend service. `api` resolves via the compose/K8s network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket hub → backend, with upgrade headers.
    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: every unknown route serves index.html for client routing.
    # CSP guards the SPA only (the API sets its own headers; /api/docs swagger
    # UI and the WS upgrade are intentionally left un-CSP'd so they keep using
    # their inline scripts).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        try_files $uri $uri/ /index.html;
    }
}
